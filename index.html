<style>
#oie-rb{--bg:#121212;--card:#1d1a1a;--card2:#262121;--line:#3a3333;--text:#f3eee8;--muted:#a79f97;--wine:#7a1c24;--wine2:#9b2430;--wine-txt:#e0525d;--ok:#7fbf8f;--warn:#e7b25a;
font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh;padding:28px 20px 120px;box-sizing:border-box;-webkit-font-smoothing:antialiased}
#oie-rb *{box-sizing:border-box}
#oie-rb .wrap{max-width:1180px;margin:0 auto}
#oie-rb h1,#oie-rb h2,#oie-rb h3,#oie-rb .serif{font-family:'Outfit',system-ui,sans-serif;font-weight:400;letter-spacing:0;margin:0}
#oie-rb h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:6px 0 10px}
#oie-rb h2{font-size:24px;margin-bottom:2px}
#oie-rb h3{font-size:18px}
#oie-rb a{color:inherit}
#oie-rb button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
#oie-rb .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
#oie-rb .crumb{font-size:13px;color:var(--muted)}
#oie-rb .crumb a{text-decoration:none;color:var(--muted)}#oie-rb .crumb a:hover{color:var(--text)}
#oie-rb .crumb{flex:1}
#oie-rb select.langsel{width:auto;flex:none;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
#oie-rb .sub{color:var(--muted);font-size:14px}
#oie-rb .sub .lnk{color:var(--text);text-decoration:underline;margin-left:8px;font-weight:500}
#oie-rb .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}
#oie-rb .chips{display:flex;flex-wrap:wrap;gap:8px}
#oie-rb .chip{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;background:transparent;transition:.15s}
#oie-rb .chip:hover{border-color:#6b5f5f}
#oie-rb .chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
#oie-rb .chip.sm{padding:5px 12px;font-size:12.5px}
#oie-rb .chip[disabled]{opacity:.35;cursor:not-allowed}
#oie-rb .grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
#oie-rb .panel{background:var(--card);border-radius:16px;padding:22px;position:sticky;top:16px}
#oie-rb .panel h3{margin-bottom:12px}
#oie-rb .panel .line{font-size:14px;margin:3px 0}
#oie-rb .btn{display:block;width:100%;text-align:center;border-radius:999px;padding:13px 18px;font-weight:600;font-size:14.5px;text-decoration:none}
#oie-rb .btn-p{background:var(--wine2);color:#fff}#oie-rb .btn-p:hover{background:#b02a37}
#oie-rb .btn-o{border:1px solid var(--line);margin-top:10px}#oie-rb .btn-o:hover{border-color:var(--wine2)}
#oie-rb .btn-w{border:1px solid var(--wine2);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
#oie-rb .btn-w:hover{background:var(--wine)}#oie-rb .btn-w.on{background:var(--wine);border-color:var(--wine)}
#oie-rb .btn-g{text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px}
#oie-rb .toggle{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--card);border-radius:14px;padding:14px 16px;margin-top:6px;width:100%;text-align:left}
#oie-rb .toggle b{display:block;font-size:14.5px}#oie-rb .toggle small{color:var(--muted);font-size:13px}
#oie-rb .sw{flex:none;width:44px;height:24px;border-radius:99px;background:#4a4343;position:relative;transition:.2s}
#oie-rb .sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#ddd;transition:.2s}
#oie-rb .sw.on{background:var(--wine2)}#oie-rb .sw.on:after{left:23px;background:#fff}
#oie-rb .cal{background:var(--card);border-radius:14px;padding:14px;max-width:340px}
#oie-rb .cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:14px;text-transform:capitalize}
#oie-rb .cal-h button{width:32px;height:32px;border-radius:50%;font-size:18px}#oie-rb .cal-h button:hover{background:var(--card2)}
#oie-rb .cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
#oie-rb .cal-g .dw{font-size:11px;color:var(--muted);padding:4px 0;text-transform:uppercase}
#oie-rb .cal-g button{height:38px;border-radius:8px;font-size:13.5px}
#oie-rb .cal-g button:hover:not([disabled]){background:var(--card2)}
#oie-rb .cal-g button.on{background:var(--wine);color:#fff}
#oie-rb .cal-g button[disabled]{opacity:.25;cursor:default}
#oie-rb .stepper{display:flex;align-items:center;gap:16px}
#oie-rb .stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:18px}
#oie-rb .stepper span{font-size:18px;min-width:24px;text-align:center}
#oie-rb .hint{color:var(--warn);font-size:13px;margin-top:10px}
#oie-rb .note{color:var(--muted);font-size:13px;margin:14px 0 18px}
#oie-rb .tabs{margin:18px 0 6px}
#oie-rb .sect{margin-top:34px}
#oie-rb .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:14px}
#oie-rb .card{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column}
#oie-rb .ph{border-radius:10px;background:linear-gradient(135deg,#2e2726,#1a1616);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#6f6461;font-family:'Outfit',system-ui,sans-serif;font-size:26px;letter-spacing:.06em}
#oie-rb .ph-name{display:block;text-align:center;padding:0 12px;font-size:clamp(17px,2vw,22px);line-height:1.15;color:#e9e1d8;letter-spacing:.02em}
#oie-rb .ph-name small{display:block;margin-top:8px;font-family:'Poppins',sans-serif;font-size:9.5px;letter-spacing:.2em;color:#b8404b;font-weight:600}
#oie-rb .hero .ph-name{font-size:clamp(30px,5vw,52px)}
#oie-rb .ph img{width:100%;height:100%;object-fit:cover;display:block}
#oie-rb .card h3{margin:12px 0 2px}
#oie-rb .meta{color:var(--muted);font-size:13px}
#oie-rb .perk{color:var(--wine-txt);font-size:12.5px;margin:6px 0 12px;flex:1}
#oie-rb .eyebrow{color:var(--wine-txt);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
#oie-rb .acts{display:flex;gap:8px;flex-wrap:wrap}
#oie-rb .empty{color:var(--muted);background:var(--card);border-radius:14px;padding:18px;margin-top:14px;font-size:14px}
#oie-rb .bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#1b1717;border-top:1px solid var(--line);padding:12px 20px}
#oie-rb .bar .in{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px}
#oie-rb .bar .btn{width:auto;padding:11px 22px}
#oie-rb .hero{border-radius:16px;aspect-ratio:21/7;margin:10px 0 24px;font-size:44px}
#oie-rb .box2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
#oie-rb .mini{background:var(--card);border-radius:12px;padding:14px;font-size:14px}
#oie-rb .mini b{display:block;font-size:13px;margin-bottom:2px}
#oie-rb .map{border:0;width:100%;height:100%;min-height:170px;border-radius:12px;filter:grayscale(1) invert(.9) contrast(.9)}
#oie-rb .vsec{margin-top:28px}#oie-rb .vsec p{color:#d6cfc8;margin:8px 0 0}
#oie-rb .how{list-style:none;padding:0;margin:8px 0 0;font-size:13.5px}
#oie-rb .how li{display:flex;align-items:center;gap:10px;margin:9px 0}
#oie-rb .how i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--wine);display:flex;align-items:center;justify-content:center;font-size:12px}
#oie-rb select,#oie-rb input,#oie-rb textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;font-size:14px}
#oie-rb select:focus,#oie-rb input:focus,#oie-rb textarea:focus{outline:1px solid var(--wine2)}
#oie-rb .small{font-size:12.5px;color:var(--muted)}
#oie-rb .stop{border-bottom:1px solid var(--line);padding:12px 0}
#oie-rb .stop-h{display:flex;gap:12px;align-items:baseline}
#oie-rb .stop-t{color:var(--wine-txt);font-weight:700;font-size:15px;min-width:48px}
#oie-rb .stop-n{flex:1;font-size:14px}#oie-rb .stop-n small{color:var(--muted);letter-spacing:.08em;font-size:11px;font-weight:700;display:block}
#oie-rb .stop-x{color:var(--muted);font-size:12px;text-decoration:underline}
#oie-rb .stop-c{display:flex;gap:8px;margin:8px 0 0 60px;flex-wrap:wrap}
#oie-rb .stop-c select{width:auto;padding:6px 10px;font-size:13px}
#oie-rb .warn{color:var(--warn);font-size:12.5px;margin:6px 0 0 60px}
#oie-rb .bd{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
#oie-rb .bd td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
#oie-rb .bd td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
#oie-rb .bd tr.tot td{font-weight:700;font-size:16px;border-bottom:0;padding-top:14px}
#oie-rb .form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
#oie-rb .form .full{grid-column:1/-1}
#oie-rb .form label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
#oie-rb .chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#d6cfc8}
#oie-rb .chk input{width:auto;margin-top:3px}
#oie-rb .err{color:var(--wine-txt);font-size:13px;margin-top:8px}
#oie-rb .banner{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;margin-bottom:16px;flex-wrap:wrap}
#oie-rb .banner div{display:flex;gap:8px}
#oie-rb .book{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
#oie-rb .bk{text-align:center;text-decoration:none;display:block}
#oie-rb .bk .ph{aspect-ratio:1/1;position:relative;border-radius:4px;filter:grayscale(1)}
#oie-rb .bk .ph span{position:absolute;left:0;right:0;bottom:22px;color:#fff;font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(20px,2.6vw,32px);letter-spacing:0}
#oie-rb .bk p{color:#e6e0da;margin:14px 8px 0;font-size:15px}
#oie-rb .done{max-width:620px;margin:40px auto;text-align:center}
#oie-rb .done .btn{margin-top:12px}
#oie-rb .notranslate{}
#oie-rb .sheet-only{display:none}
/* --- Sorpréndeme (links to "The city by night") --- */
#oie-rb .surprise-cta{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;margin-top:6px;padding:16px 18px;border-radius:14px;text-decoration:none;background:linear-gradient(120deg,#5a1419,#2a1012);border:1px solid var(--wine2);box-shadow:0 8px 24px rgba(122,28,36,.25);transition:.15s}
#oie-rb .surprise-cta:hover{border-color:#c43a47;transform:translateY(-1px)}
#oie-rb .surprise-cta b{display:block;font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:19px;letter-spacing:.01em}
#oie-rb .surprise-cta small{color:#e6cfd0;font-size:13px}
#oie-rb .surprise-cta .arr{flex:none;width:38px;height:38px;border-radius:50%;background:var(--wine2);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
#oie-rb .surprise-cta.inline{margin:18px 0 0}
/* --- All products catalogue (embedded in Hostinger) --- */
html.oie-cat-page .oie-hdr,html.oie-cat-page .oie-ftr,html.oie-cat-page .oie-mnav{display:none!important}
html.oie-cat-page body{background:#1a1a1a}
#oie-rb .cat-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
#oie-rb .cat-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,260px);gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
#oie-rb .cat-row .card{scroll-snap-align:start}
#oie-rb .cat-row a.btn-w{text-decoration:none}
#oie-rb.oie-cat{padding:0 0 8px;min-height:0;background:#1a1a1a}
#oie-rb.oie-cat .card{background:#232020}
/* --- Nightlife: VIP table price + music --- */
#oie-rb .vip{color:#f3d9a4;font-size:12.5px;font-weight:600;margin-top:6px}
#oie-rb .music{color:#cfc6bd;font-size:12.5px;margin-top:4px}
#oie-rb .music b{color:var(--muted);font-weight:600;letter-spacing:.08em;font-size:10.5px;text-transform:uppercase;margin-right:4px}
/* --- Hotel invitation message (checkout) --- */
#oie-rb .invite{display:none;margin-top:10px;padding:16px 18px;border-radius:12px;background:linear-gradient(135deg,#231a1a,#1a1414);border:1px solid #4a3a2c;border-left:3px solid #c9a46a}
#oie-rb .invite.show{display:block;animation:oieFade .35s ease}
#oie-rb .invite .eyebrow{color:#c9a46a;font-size:10.5px}
#oie-rb .invite p{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:15px;line-height:1.6;color:#efe6da;margin:8px 0 0}
#oie-rb .invite p.short{font-family:'Poppins',sans-serif;font-style:normal;font-size:12.5px;color:#c9a46a;margin-top:10px}
@keyframes oieFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media(max-width:900px){
#oie-rb{padding:18px 16px 110px}
#oie-rb .grid2{grid-template-columns:1fr;gap:18px}
#oie-rb .panel.dock{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;border-radius:16px 16px 0 0;padding:14px 16px;max-height:80vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.5);border-top:1px solid var(--line)}
#oie-rb .panel.dock .dock-body{display:none}
#oie-rb .panel.dock.open .dock-body{display:block}
#oie-rb .panel.dock h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:17px}
#oie-rb .sheet-only{display:inline}
#oie-rb .panel.routep{order:-1;position:static}
#oie-rb .book{grid-template-columns:1fr}
#oie-rb .box2{grid-template-columns:1fr}
#oie-rb .form{grid-template-columns:1fr}
#oie-rb .hero{aspect-ratio:16/9}
#oie-rb .cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
#oie-rb .bar .in{flex-direction:column;align-items:stretch;gap:8px;text-align:center}
#oie-rb .bar .btn{width:100%}
#oie-rb .stop-c,#oie-rb .warn{margin-left:0}
}
@media(max-width:380px){#oie-rb .cards{grid-template-columns:1fr}}

/* inside a sandboxed iframe (Hostinger embed): no fixed bars */
#oie-rb.oie-embed{min-height:0;padding-bottom:28px}
#oie-rb.oie-embed .bar{position:static;margin-top:28px;border-radius:14px;border:1px solid var(--line)}
@media(max-width:900px){#oie-rb.oie-embed .panel.dock{position:static;border-radius:16px;box-shadow:none;max-height:none}#oie-rb.oie-embed .panel.dock .dock-body{display:block}}
</style>

<script>
/* ===== ONE IN EXPERIENCE · SETTINGS (edit here) ===== */

function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- URL params (works inside an iframe too) ---------- */
function allParams(){
  var srcs=[location.search,location.hash.split("?")[1]||""];
  try{srcs.push(window.parent.location.search)}catch(e){}
  try{if(document.referrer)srcs.push(new URL(document.referrer).search)}catch(e){}
  var out={};
  srcs.forEach(function(s){ if(!s) return; new URLSearchParams(s.replace(/^\?/,"")).forEach(function(v,k){ if(!out[k]) out[k]=v; }); });
  return out;
}
var P=allParams();
if(P.view==="catalog"){ ROOT.classList.add("oie-cat"); document.documentElement.style.background="#1a1a1a"; document.documentElement.classList.add("oie-cat-page"); }

/* ---------- referral code (hotel / affiliate) ---------- */
var MEMREF=(P.ref||P.hotel||P.aff||"").trim().toUpperCase().slice(0,60);
(function(){
  var r=MEMREF;
  if(r){ sset("oie_ref",{c:r,t:Date.now()}); try{document.cookie="oie_ref="+encodeURIComponent(r)+";max-age="+(90*864e2)+";path=/;SameSite=Lax"}catch(e){} }
})();
function refCode(){
  if(MEMREF) return MEMREF;
  var s=sget("oie_ref"); if(s&&s.c&&Date.now()-s.t<90*864e5) return s.c;
  try{ var m=document.cookie.match(/(?:^|; )oie_ref=([^;]+)/); return m?decodeURIComponent(m[1]):""; }catch(e){ return MEMREF; }
}

/* ---------- state ---------- */
var D={lang:null,surprise:false,types:[],date:null,start:null,mood:null,music:[],pax:2,tab:"all",levels:[],stops:[],cust:{name:"",email:"",wa:"",country:"",hotel:"",notes:"",consent:false},calM:null,langAsked:false};
var S=Object.assign({},D,sget(KEY)||{});
S.cust=Object.assign({},D.cust,S.cust||{});
if(!Array.isArray(S.music)) S.music=[];
S.surprise=false;
if(S.date && S.date<todayISO()){ S.date=null; S.stops=[]; }
S.stops=S.stops.filter(function(s){ return !!find(s.id); }); // drop venues removed from the catalogue
function save(){ sset(KEY,S); }
if(P.line==="dining"||P.line==="nightlife"){ S.line=P.line; S.types=[P.line==="dining"?"dinner":"party"]; S.surprise=false; }

/* ---------- language ---------- */
function pickLang(){
  var c=[P.lang, S.lang, ROOT.getAttribute("data-lang"), (document.documentElement.lang||"").slice(0,2)];
  try{ c.push((window.parent.document.documentElement.lang||"").slice(0,2)) }catch(e){}
  for(var i=0;i<c.length;i++){ var l=(c[i]||"").toLowerCase(); if(OIE_I18N[l]&&CFG.langs.indexOf(l)>-1) return l; }
  return CFG.defaultLang;
}
var L=pickLang();
function t(k,vars){ var s=(OIE_I18N[L]&&OIE_I18N[L][k])||OIE_I18N.en[k]||k; if(vars) for(var x in vars) s=s.replace("{"+x+"}",vars[x]); return s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }

/* ---------- time helpers ---------- */
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function p2(n){ return (n<10?"0":"")+n; }
function toMin(s){ var a=s.split(":"); return (+a[0])*60+(+a[1]); }
function fmt(m){ m=((m%1440)+1440)%1440; return p2(Math.floor(m/60))+":"+p2(m%60); }
function startMin(){ if(!S.start) return null; var m=toMin(S.start); return m<12*60?m+1440:m; } // 00:00 = midnight of the chosen night
function dateObj(){ if(!S.date) return null; var a=S.date.split("-"); return new Date(+a[0],a[1]-1,+a[2]); }
function dow(){ var d=dateObj(); return d?d.getDay():null; }
function fmtDate(short){ var d=dateObj(); if(!d) return ""; try{ return new Intl.DateTimeFormat(L,{weekday:"short",day:"numeric",month:"short"}).format(d) }catch(e){ return S.date } }
function businessDaysUntil(){ var d=dateObj(); if(!d) return null; var c=new Date(); c.setHours(0,0,0,0); var n=0; while(c<d){ c.setDate(c.getDate()+1); var w=c.getDay(); if(w!==0&&w!==6&&c<=d) n++; } return n; }
function days(spec){ var out=[]; spec.split(",").forEach(function(p){ var a=p.split("-"); if(a.length==2){ for(var i=+a[0];i<=+a[1];i++) out.push(i) } else out.push(+a[0]); }); return out; }
function ranges(item,d){ return (item.h||[]).filter(function(r){ return days(r[0]).indexOf(d)>-1 }).map(function(r){ return [toMin(r[1]),toMin(r[2])]; }); }
function isOpen(item,d,m){ return ranges(item,d).some(function(r){ return m>=r[0]&&m<r[1]; }); }
function openWithin(item,d,a,b){ return ranges(item,d).some(function(r){ return r[0]<b && r[1]>a; }); }
function kindOf(item){ if(item.price!==undefined) return "exp"; if(item.s==="club") return "club"; if(item.l==="d") return "rest"; return "bar"; }
function dur(k){ return {rest:120,bar:90,club:180,exp:120}[k]; }
function slots(item,d,from){
  var out=[], k=kindOf(item), tail=(k==="club")?60:(k==="exp"?(item.dur||90):60);
  ranges(item,d).forEach(function(r){ for(var m=Math.ceil(r[0]/30)*30;m<=r[1]-tail;m+=30){ if(from==null||m>=from) out.push(m); } });
  return out;
}

/* ---------- labels ---------- */
var TYPES=["dinner","drinks","party","workshop","crawl","private","celebration"];
var MOODS=["quiet","lively","romantic","friends","corporate"];
var MUS=["alt","comercial","urbano","house","rock","latino","variado"];
var OCC=["proposal","birthday","anniv","bachelor","date","other"];
var TIMES=["18:00","19:00","20:00","21:00","22:00","23:00","00:00"];
function lvl(n){ return "$$$$".slice(0,n); }
function lineName(item){ var k=kindOf(item); return k==="exp"?"ONE IN SIGNATURE":(item.l==="d"?"ONE IN DINING":"ONE IN NIGHTLIFE"); }
function lineShort(item){ var k=kindOf(item); return k==="exp"?"SIGNATURE":(item.l==="d"?"DINING":"NIGHTLIFE"); }
function money(n){ try{ return new Intl.NumberFormat("en-US",{style:"currency",currency:CFG.currency,maximumFractionDigits:0}).format(n) }catch(e){ return "$"+n } }
function usd(n){ return "$"+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
/* VIP table: price fixed by category ($$ 500 · $$$ 800 · $$$$ 1,100 for 8-10 guests) */
function vipPrice(item){ return item.boxPrice||(CFG.vipPrices&&CFG.vipPrices[item.lv])||CFG.boxVipPrice; }
function vipText(item){ return t("vip_label",{x:usd(vipPrice(item))})+(item.lv>=4?" "+t("vip_size"):""); }
function musicText(item){ if(!item.md) return ""; return item.md[L]||item.md.en||""; }
function paxTxt(){ return S.pax+" "+(S.pax==1?t("person"):t("people")); }
function summary(){
  var a=[]; if(S.types.length) a.push(S.types.map(function(x){return t("t_"+x)}).join(" · "));
  if(S.date) a.push(fmtDate()+(S.start?" · "+S.start:""));
  if(S.mood) a.push(t("m_"+S.mood)); if(S.music.length) a.push(S.music.map(function(x){return t("mu_"+x)}).join(" / ")); a.push(paxTxt()); return a;
}
function find(id){ for(var i=0;i<V.length;i++) if(V[i].id===id) return V[i]; for(i=0;i<X.length;i++) if(X[i].id===id) return X[i]; return null; }
function inRoute(id){ return S.stops.some(function(s){return s.id===id}); }
function nightOnly(){ return S.line==="nightlife"; }

/* ---------- matching ---------- */
function moods(v){
  var k=kindOf(v);
  if(k==="club") return ["lively","friends"];
  if(v.s==="roof"||v.s==="lounge") return ["lively","friends","corporate"];
  if(k==="bar") return v.lv>=3?["romantic","lively","friends"]:["lively","friends"];
  if(k==="exp") return ["friends","romantic","corporate"];
  if(v.lv>=4) return ["romantic","quiet","corporate"];
  if(v.lv==3) return ["friends","lively","corporate","romantic"];
  return ["friends","lively","quiet"];
}
function musicOk(item){
  var k=kindOf(item); if(!S.music.length||(k!=="bar"&&k!=="club")) return true;
  return (item.mu||[]).some(function(x){ return S.music.indexOf(x)>-1; });
}
function wants(k){
  var T=S.types; if(!T.length) return true;
  function any(a){ return a.some(function(x){return T.indexOf(x)>-1}) }
  if(k==="rest") return any(["dinner","private","celebration"]);
  if(k==="bar") return any(["drinks","crawl","celebration","party"]);
  if(k==="club") return any(["party"]);
  if(k==="exp") return any(["workshop","private","celebration"]);
  return true;
}
function visible(item){
  var k=kindOf(item), d=dow(), m=startMin();
  if(nightOnly() && k==="rest") return false;   // ONE IN NIGHTLIFE: bars & clubs only
  if(!musicOk(item)) return false;
  if(item.req) return S.types.indexOf("party")>-1 && (!S.levels.length || S.levels.indexOf(item.lv)>-1);
  if(S.levels.length && S.levels.indexOf(item.lv)<0) return false;
  if(!wants(k)) { if(!(k==="club"&&m>=22*60&&!S.types.length)) return false; }
  if(d==null||m==null) return true;
  function has(from,to){ return slots(item,d,from).some(function(x){return x<=to}); }
  if(k==="club") return (S.types.indexOf("party")>-1||m>=22*60) && has(m,29*60);
  if(k==="rest") return has(m-30,m+120);
  if(k==="exp") return has(m-150,m+120);
  return has(m,m+300);
}
function score(item){ var s=0; if(S.mood&&moods(item).indexOf(S.mood)>-1) s+=10; if(S.music.length&&(item.mu||[]).some(function(x){return S.music.indexOf(x)>-1})) s+=8; s+=item.lv; if(item.img) s+=1; return s; }
function sorted(list){ return list.slice().sort(function(a,b){ return score(b)-score(a) }); }

/* ---------- route ---------- */
function stopEnd(s){ var it=find(s.id); return toMin(s.time)+(it&&it.dur?it.dur:dur(s.k)); }
function sortStops(){ S.stops.sort(function(a,b){ return tm(a.time)-tm(b.time) }); }
function tm(s){ var m=toMin(s); return m<12*60?m+1440:m; }
function nextSlot(item){
  var d=dow(), st=startMin()||19*60;
  var after=st; S.stops.forEach(function(s){ var e=tm(s.time)+(find(s.id)&&find(s.id).dur||dur(s.k)); if(e>after) after=e; });
  var sl=slots(item,d==null?5:d,st); if(!sl.length) return fmt(st);
  for(var i=0;i<sl.length;i++) if(sl[i]>=after) return fmt(sl[i]);
  return fmt(sl[sl.length-1]);
}
function addStop(id,time,occ){
  var it=find(id); if(!it||it.req) return;
  var k=kindOf(it), ex=S.stops.filter(function(s){return s.id===id})[0];
  if(ex){ if(time) ex.time=time; if(occ!==undefined) ex.occ=occ; }
  else S.stops.push({id:id,k:k,time:time||nextSlot(it),occ:(k==="rest"&&occ)?occ:""});
  sortStops(); save();
}
function removeStop(id){ S.stops=S.stops.filter(function(s){return s.id!==id}); save(); }
function warnings(){
  var d=dow(), w={};
  S.stops.forEach(function(s,i){
    var it=find(s.id), m=tm(s.time), a=[];
    if(d!=null && it && !isOpen(it,d,m)) a.push(t("warn_closed"));
    var nx=S.stops[i+1]; if(nx && tm(nx.time) < m+(it&&it.dur||dur(s.k))) a.push(t("warn_overlap"));
    if(s.k==="club" && S.pax>10) a.push(t("warn_box"));
    w[s.id]=a;
  });
  return w;
}
function priceLines(){
  var rows=[], total=0, tbc=false;
  S.stops.forEach(function(s){
    var it=find(s.id); if(!it) return;
    var name=s.time+" · "+lineShort(it)+" · "+it.n;
    if(s.k==="club"){ var p=vipPrice(it); rows.push({s:s,label:name,item:t("l_box")+(it.lv>=4?" "+t("vip_size"):""),price:p,pay:"box"}); total+=p; }
    else if(s.k==="exp"){ if(it.price==null){ rows.push({s:s,label:name,item:t("l_exp"),price:null}); tbc=true; } else { rows.push({s:s,label:name,item:t("l_exp"),price:it.price,pay:"experience"}); total+=it.price; } }
    else { rows.push({s:s,label:name,item:t("l_res"),price:0}); if(s.occ){ rows.push({s:s,label:"",item:t("l_special")+" · "+t("occ_"+s.occ),price:0}); } }
  });
  return {rows:rows,total:total,tbc:tbc};
}

/* ---------- views ---------- */
function ph(item,cls){
  return '<div class="ph '+(cls||"")+'">'+(item.img?'<img src="'+esc(item.img)+'" alt="'+esc(item.n)+'" loading="lazy">':'<span class="ph-name notranslate" translate="no">'+esc(item.n)+'<small>'+esc(lineName(item))+'</small></span>')+'</div>';
}
function langSel(){
  if(CFG.langs.length<2) return "";
  return '<select class="langsel notranslate" translate="no" data-act="lang" aria-label="Language">'+CFG.langs.map(function(l){return '<option value="'+l+'"'+(l===L?" selected":"")+'>'+OIE_LANG_NAMES[l]+'</option>'}).join("")+'</select>';
}
function top(crumbs){ return '<div class="topbar"><div class="crumb">'+crumbs+'</div>'+langSel()+'</div>'+banner(); }
function banner(){
  if(S.langAsked) return "";
  var b=((navigator.languages&&navigator.languages[0])||navigator.language||"").slice(0,2).toLowerCase();
  if(!b||b===L||!OIE_I18N[b]||CFG.langs.indexOf(b)<0) return "";
  return '<div class="banner"><span>'+esc(OIE_I18N[b].lang_suggest.replace("{x}",OIE_LANG_NAMES[b]))+'</span><div><button class="btn-w" data-act="setlang" data-v="'+b+'">'+esc(OIE_I18N[b].yes)+'</button><button class="btn-g" data-act="nolang">'+esc(OIE_I18N[b].no)+'</button></div></div>';
}
function chip(act,v,on,label,dis){ return '<button class="chip'+(on?" on":"")+'" data-act="'+act+'" data-v="'+esc(v)+'"'+(dis?" disabled":"")+'>'+esc(label)+'</button>'; }
/* "Sorpréndeme": surprise route designed by the concierge = product "The city by night" */
function surpriseCta(extra){
  if(!CFG.surpriseUrl) return "";
  return '<a class="surprise-cta '+(extra||"")+'" href="'+esc(CFG.surpriseUrl)+'" target="'+(EMBED?'_blank':'_top')+'" rel="noopener"><span><b>'+esc(t("surprise"))+'</b><small>'+esc(t("surprise_sub"))+'</small></span><span class="arr">›</span></a>';
}
function musicChips(){ return '<div class="label">'+esc(t("music"))+'</div><div class="chips">'+MUS.map(function(x){return chip("music",x,S.music.indexOf(x)>-1,t("mu_"+x))}).join("")+'</div>'; }

function vBook(){
  var I=CFG.bookImages;
  function card(key,name,tag,href){ return '<a class="bk" href="'+href+'">'+'<div class="ph">'+(I[key]?'<img src="'+esc(I[key])+'" alt="">':'')+'<span class="notranslate" translate="no">'+name+'</span></div><p>'+esc(t(tag))+'</p></a>'; }
  return top("")+'<h1>'+esc(t("book_title"))+'</h1><div class="sub">'+esc(t("book_sub"))+'</div><div class="book">'+
    card("dining","ONE IN DINING","dining_tag","#/plan?line=dining")+card("nightlife","ONE IN NIGHTLIFE","nightlife_tag","#/plan?line=nightlife")+
    card("signature","ONE IN SIGNATURE","signature_tag",CFG.signatureUrl||"#/places?tab=exp")+'</div>';
}

function selPanel(){
  var ready=S.date&&S.start;
  return '<aside class="panel dock" id="oie-dock"><h3 data-act="dock">'+esc(t("your_selection"))+'<span class="sheet-only">▴</span></h3>'+
    (ready?summary().map(function(x){return '<div class="line">'+esc(x)+'</div>'}).join(""):'<div class="line sub">'+esc(t("sel_empty"))+'</div>')+
    '<div class="dock-body"><p class="note">'+esc(t("sel_hint"))+'</p></div>'+
    '<button class="btn btn-p" data-act="go-places">'+esc(t("see_places"))+'</button><div id="oie-hint"></div></aside>';
}
function calendar(){
  var now=new Date(), base=S.calM?new Date(S.calM+"-01T12:00:00"):(dateObj()||now);
  var y=base.getFullYear(), m=base.getMonth(), first=new Date(y,m,1), off=(first.getDay()+6)%7, n=new Date(y,m+1,0).getDate(), today=todayISO();
  var title; try{ title=new Intl.DateTimeFormat(L,{month:"long",year:"numeric"}).format(first) }catch(e){ title=y+"-"+(m+1) }
  var wd=[]; for(var i=0;i<7;i++){ var dd=new Date(2024,0,1+i); try{ wd.push(new Intl.DateTimeFormat(L,{weekday:"narrow"}).format(dd)) }catch(e){ wd.push("MTWTFSS"[i]) } }
  var prevOk = (y>now.getFullYear()) || (y===now.getFullYear() && m>now.getMonth());
  var h='<div class="cal"><div class="cal-h"><button data-act="cal" data-v="-1" '+(prevOk?"":"disabled")+' aria-label="previous">‹</button><span>'+esc(title)+'</span><button data-act="cal" data-v="1" aria-label="next">›</button></div><div class="cal-g">';
  wd.forEach(function(w){ h+='<div class="dw">'+esc(w)+'</div>' });
  for(i=0;i<off;i++) h+='<span></span>';
  for(var dnum=1;dnum<=n;dnum++){ var iso=y+"-"+p2(m+1)+"-"+p2(dnum); h+='<button data-act="date" data-v="'+iso+'"'+(iso===S.date?' class="on"':'')+(iso<today?" disabled":"")+'>'+dnum+'</button>'; }
  return h+'</div></div>';
}
function vPlan(){
  var crumb=(S.line==="dining"?"Dining":"Nightlife")+" › "+esc(t("bc_plan"));
  return top('<a href="#/book">'+crumb+'</a>')+'<div class="grid2"><div>'+
    '<h1>'+esc(t("p1_title"))+'</h1>'+
    surpriseCta()+
    '<div class="label">'+esc(t("plan_type"))+'</div><div class="chips">'+TYPES.map(function(x){return chip("type",x,S.types.indexOf(x)>-1,t("t_"+x))}).join("")+'</div>'+
    '<div class="label">'+esc(t("day"))+'</div>'+calendar()+
    '<div class="label">'+esc(t("start_time"))+'</div><div class="chips">'+TIMES.map(function(x){return chip("start",x,S.start===x,x)}).join("")+'</div>'+
    '<div class="label">'+esc(t("mood"))+'</div><div class="chips">'+MOODS.map(function(x){return chip("mood",x,S.mood===x,t("m_"+x))}).join("")+'</div>'+
    (S.line!=="dining"?musicChips():'')+
    '<div class="label">'+esc(t("guests"))+'</div><div class="stepper"><button data-act="pax" data-v="-1" aria-label="-">−</button><span>'+S.pax+'</span><button data-act="pax" data-v="1" aria-label="+">+</button></div>'+
    '</div>'+selPanel()+'</div>';
}
function card(item){
  var k=kindOf(item), added=inRoute(item.id), perk=(item.p&&item.p.length)?(t("partner")+": "+item.p[0][0]):t("card_perk");
  var meta=esc(item.c)+" · "+esc(item.di)+" · "+lvl(item.lv);
  var btn=item.req?'<button class="btn-w" data-act="ask" data-v="'+item.id+'">'+esc(t("ask_concierge"))+'</button>':
    '<button class="btn-w'+(added?" on":"")+'" data-act="add" data-v="'+item.id+'">'+esc(added?t("added"):(k==="club"?t("book_box"):t("add")))+'</button>';
  var extra=(k==="club"?'<div class="vip">'+esc(vipText(item))+'</div>':'')+(item.md?'<div class="music"><b>'+esc(t("music_lbl"))+'</b>'+esc(musicText(item))+'</div>':'');
  return '<div class="card">'+ph(item)+(k==="exp"?'<div class="eyebrow" style="margin-top:12px">SIGNATURE</div>':'')+'<h3 class="notranslate" translate="no"'+(k==="exp"?' style="margin-top:4px"':'')+'>'+esc(item.n)+'</h3><div class="meta">'+meta+'</div>'+extra+'<div class="perk">'+esc(item.req?t("on_request"):perk)+'</div><div class="acts">'+btn+'<a class="btn-g" href="#/venue/'+item.id+'">'+esc(t("view"))+'</a></div></div>';
}
function section(title,sub,items){
  return '<div class="sect"><h2>'+esc(title)+'</h2><div class="sub">'+esc(sub)+'</div>'+(items.length?'<div class="cards">'+items.map(card).join("")+'</div>':'<div class="empty">'+esc(t("none_found"))+'</div>')+'</div>';
}
function vPlaces(){
  var night=nightOnly(); if(night&&S.tab==="rest") S.tab="all";
  var tab=S.tab, rest=night?[]:sorted(V.filter(function(v){return kindOf(v)==="rest"&&visible(v)})),
    bars=sorted(V.filter(function(v){return kindOf(v)==="bar"&&visible(v)})),
    clubs=sorted(V.filter(function(v){return kindOf(v)==="club"&&visible(v)})),
    exps=X.filter(function(x){ return (!S.levels.length||S.levels.indexOf(x.lv)>-1) && (tab==="exp"||visible(x)) });
  var tabs=night?["all","bars","exp"]:["all","rest","bars","exp"];
  var h=top('<a href="#/plan">'+esc(t("bc_plan"))+'</a> › '+esc(t("bc_places")))+
    '<h1>'+esc(t("p2_title"))+'</h1><div class="sub">'+esc(summary().join(" · "))+'<a class="lnk" href="#/plan">'+esc(t("change_filter"))+'</a></div>'+
    (night?surpriseCta("inline"):'')+
    '<div class="chips tabs">'+tabs.map(function(x){return chip("tab",x,tab===x,t("tab_"+x))}).join("")+'</div>'+
    '<div class="label" style="margin-top:14px">'+esc(t("price_level"))+'</div><div class="chips">'+[2,3,4].map(function(n){return chip("level",n,S.levels.indexOf(n)>-1,lvl(n))}).join("")+'</div>'+
    ((tab==="all"||tab==="bars")&&S.line!=="dining"?musicChips():'');
  if(tab==="all"||tab==="rest") { if(!night) h+=section(t("rest_h"),t("rest_sub"),rest); }

/* Netlify Forms → form "oie-booking". On Netlify, the function submission-created.js sends the Brevo emails. */
function postNetlifyForm(payload,text){
  if(!CFG.formUrl) return;
  try{
    var c=payload.customer, fd=new URLSearchParams();
    fd.append("form-name","oie-booking"); fd.append("bot-field","");
    fd.append("name",c.name); fd.append("email",c.email); fd.append("whatsapp",c.whatsapp); fd.append("country",c.country);
    fd.append("hotel",c.hotel||""); fd.append("ref",payload.ref||""); fd.append("notes",c.notes||"");
    fd.append("date",payload.plan.date||""); fd.append("start",payload.plan.start||""); fd.append("guests",String(payload.plan.guests));
    fd.append("lang",payload.lang); fd.append("route",text); fd.append("total",String(payload.total)+" "+payload.currency);
    fd.append("payload",JSON.stringify(payload));
    var same=false; try{ same=new URL(CFG.formUrl,location.href).origin===location.origin }catch(e){}
    fetch(CFG.formUrl,{method:"POST",mode:same?"same-origin":"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:fd.toString(),keepalive:true}).catch(function(){});
  }catch(e){}
}

/* ---------- router ---------- */
function route(){
  var h=(EMBED?CUR:location.hash).replace(/^#\/?/,""), q=h.split("?"), parts=q[0].split("/"), qs=new URLSearchParams(q[1]||"");
  var line=qs.get("line")||P.line;
  if(line==="dining"||line==="nightlife"){ if(S.line!==line){ S.line=line; var pre=line==="dining"?"dinner":"party"; if(S.types.indexOf(pre)<0) S.types.push(pre); save(); } }
  if(qs.get("tab")){ S.tab=qs.get("tab"); }
  var v=parts[0]||(P.view==="catalog"?"catalog":(P.line?"plan":"book")), html;
  if(v==="catalog") html=vCatalog(line||"dining"); else if(v==="plan") html=vPlan(); else if(v==="places") html=vPlaces(); else if(v==="venue") html=vVenue(parts[1]); else if(v==="route") html=vRoute(); else if(v==="send") html=vSend(); else if(v==="done") html=vDone(); else html=vBook();
  ROOT.innerHTML='<div class="wrap">'+html+'</div>';
  ROOT.setAttribute("lang",L);
}

function go(h){ if(!EMBED){ location.hash=h; return; } CUR=h; route(); try{ window.scrollTo(0,0) }catch(e){} }

/* ---------- events ---------- */
ROOT.addEventListener("click",function(e){
  var ln=e.target.closest("a[href^='#/']"); if(ln&&EMBED){ e.preventDefault(); go(ln.getAttribute("href")); return; }
  var el=e.target.closest("[data-act]"); if(!el||!ROOT.contains(el)||el.tagName==="SELECT") return;
  var a=el.getAttribute("data-act"), v=el.getAttribute("data-v");
  switch(a){
    case "type": var i=S.types.indexOf(v); if(i>-1) S.types.splice(i,1); else S.types.push(v); break;
    case "date": S.date=v; break;
    case "cal": var b=S.calM?new Date(S.calM+"-01T12:00:00"):(dateObj()||new Date()); b=new Date(b.getFullYear(),b.getMonth()+(+v),1); S.calM=b.getFullYear()+"-"+p2(b.getMonth()+1); break;
    case "start": S.start=v; break;
    case "mood": S.mood=S.mood===v?null:v; break;
    case "music": var mi=S.music.indexOf(v); if(mi>-1) S.music.splice(mi,1); else S.music.push(v); break;
    case "pax": S.pax=Math.max(1,Math.min(50,S.pax+(+v))); break;
    case "tab": S.tab=v; break;
    case "level": var n=+v, j=S.levels.indexOf(n); if(j>-1) S.levels.splice(j,1); else S.levels.push(n); break;
    case "go-places":
      if(!S.date||!S.start){ var hn=document.getElementById("oie-hint"); if(hn) hn.innerHTML='<p class="hint">'+esc(t("need_date"))+'</p>'; return; }
      save(); go("#/places"); return;
    case "add": if(inRoute(v)) removeStop(v); else addStop(v); rerender(true); return;
    case "vtime": pend.time=v; break;
    case "vadd": addStop(v,pend.time,pend.occ); go("#/route"); return;
    case "rm": removeStop(v); break;
    case "dock": var dk=document.getElementById("oie-dock"); if(dk) dk.classList.toggle("open"); return;
    case "ask": var it=find(v); window.open(waLink(t("wa_intro").replace(/:$/,"")+" — "+(it?it.n:"")+(S.date?" · "+fmtDate()+" "+(S.start||""):"")+" · "+paxTxt()+(refCode()?" · "+t("lbl_ref")+": "+refCode():"")),"_blank","noopener"); return;
    case "to-send": if(S.stops.length) go("#/send"); return;
    case "submit": submit(); return;
    case "setlang": L=v; S.lang=v; S.langAsked=true; break;
    case "nolang": S.langAsked=true; break;
    case "reset": S=Object.assign({},D,{lang:S.lang,langAsked:true,cust:S.cust,stops:[],music:[]}); save(); go("#/plan"); return;
    default: return;
  }
  save(); rerender(true);
});
ROOT.addEventListener("change",function(e){
  var el=e.target, a=el.getAttribute("data-act"), v=el.getAttribute("data-v");
  if(a==="lang"){ L=el.value; S.lang=L; S.langAsked=true; save(); rerender(true); return; }
  if(a==="vocc"){ pend.occ=el.value; rerender(true); return; }
  if(a==="socc"){ S.stops.forEach(function(s){ if(s.id===v) s.occ=el.value; }); save(); rerender(true); return; }
  if(a==="stime"){ S.stops.forEach(function(s){ if(s.id===v) s.time=el.value; }); sortStops(); save(); rerender(true); return; }
  var f=el.getAttribute("data-f"); if(f){ S.cust[f]=el.type==="checkbox"?el.checked:el.value; save(); }
});
ROOT.addEventListener("input",function(e){ var f=e.target.getAttribute("data-f"); if(f&&e.target.type!=="checkbox"){ S.cust[f]=e.target.value; save(); } });
/* Hotel / place of stay: reveal the boutique invitation message as soon as the guest interacts with the field */
ROOT.addEventListener("focusin",function(e){ if(e.target&&e.target.id==="oie-hotel"){ var b=document.getElementById("oie-invite"); if(b) b.classList.add("show"); } });

route();
})();
